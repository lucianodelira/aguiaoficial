<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Águia Oficial | Baixar App Oficial</title>
<meta name="description" content="Águia Oficial Bet – Baixe agora o aplicativo oficial da Águia Oficial na Play Store.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://www.bancaaguiaoficial.net/">
<link rel="icon" type="image/png" sizes="192x192"
href="https://raw.githubusercontent.com/lucianodelira/aguiaoficial/refs/heads/main/icons/icon-192.png">
<link rel="apple-touch-icon"
href="https://raw.githubusercontent.com/lucianodelira/aguiaoficial/refs/heads/main/icons/icon-192.png">
<meta name="theme-color" content="#0d0d0d">
<meta property="og:title" content="Águia Oficial – Aplicativo Oficial">
<meta property="og:description" content="Baixe o app oficial da Águia Oficial na Play Store.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.bancaaguiaoficial.net/">
<meta property="og:image" content="https://raw.githubusercontent.com/lucianodelira/aguiaoficial/refs/heads/main/icons/icon-192.png">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #0d0d0d;
    font-family: Arial, sans-serif;
  }

  /* Iframe ocupa quase toda a tela */
  .iframe-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: calc(100% - 70px); /* deixa espaço para a faixa de baixo */
    z-index: 1;
  }

  .iframe-container iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* Faixa inferior fixa */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 70px;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 8px 10px;
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.6);
    z-index: 10;
    border-top: 1px solid #222;
  }

  .btn {
    flex: 1;
    max-width: 120px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    text-decoration: none;
    color: #fff;
    font-weight: bold;
    font-size: 13px;
    border-radius: 12px;
    transition: transform 0.2s, opacity 0.2s;
    line-height: 1.2;
    padding: 6px 4px;
  }

  .btn:active {
    transform: scale(0.96);
    opacity: 0.9;
  }

  /* Botão Download */
  .btn-download {
    background: linear-gradient(45deg, #00c853, #1db954);
  }

  /* Botão Grupo de Palpites */
  .btn-palpites {
    background: linear-gradient(45deg, #00e676, #00c853);
  }

  /* Botão Outras Bancas */
  .btn-outras {
    background: linear-gradient(45deg, #2196f3, #1976d2);
  }

  /* Ajuste para telas muito pequenas */
  @media (max-width: 360px) {
    .btn {
      font-size: 12px;
      max-width: 105px;
    }
  }
</style>
</head>
<body>

  <!-- Iframe full screen (sem sandbox) -->
  <div class="iframe-container">
    <iframe 
      src="https://app.aguiaoficial.com/pr/stBCno8r"
      allowfullscreen
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>

  <!-- Faixa inferior com 3 botões -->
  <div class="bottom-bar">
    <a href="https://play.google.com/store/apps/details?id=aguia.oficial" 
       class="btn btn-download" 
       target="_blank" 
       rel="noopener noreferrer">
      📲 Download
    </a>

    <a href="https://danny.bancabrasileira.net" 
       class="btn btn-palpites" 
       target="_blank" 
       rel="noopener noreferrer">
      💬 Grupo de<br>Palpites
    </a>

    <a href="https://www.zepitaco.com" 
       class="btn btn-outras" 
       target="_blank" 
       rel="noopener noreferrer">
      🏦 Outras<br>Bancas
    </a>
  </div>

</body>
</html>
