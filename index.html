
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Águia Oficial | Baixar App Oficial</title>

<meta name="description" content="Águia Oficial Bet – Baixe agora o aplicativo oficial da Águia Oficial na Play Store.">
<meta name="robots" content="index, follow">

<link rel="canonical" href="https://www.bancaaguiaoficial.net/">

<link rel="icon" type="image/png" sizes="192x192"
href="https://raw.githubusercontent.com/lucianodelira/aguiaoficial/refs/heads/main/icons/icon-192.png">

<link rel="apple-touch-icon"
href="https://raw.githubusercontent.com/lucianodelira/aguiaoficial/refs/heads/main/icons/icon-192.png">

<meta name="theme-color" content="#0d0d0d">

<meta property="og:title" content="Águia Oficial – Aplicativo Oficial">
<meta property="og:description" content="Baixe o app oficial da Águia Oficial na Play Store.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.bancaaguiaoficial.net/">
<meta property="og:image" content="https://raw.githubusercontent.com/lucianodelira/aguiaoficial/refs/heads/main/icons/icon-192.png">

<style>
:root {
  --footer-height: 32px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0d0d0d;
  font-family: Arial, sans-serif;
}

/* IFRAME PRINCIPAL */
.iframe-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;

  height: calc(
    100% - var(--footer-height) - var(--safe-bottom)
  );

  height: calc(
    100dvh - var(--footer-height) - var(--safe-bottom)
  );

  z-index: 1;
}

.iframe-container iframe {
  width: 100%;
  height: 100%;
  display: block;
  border: none;
}

/* RODAPÉ FINO */
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;

  width: 100%;
  height: calc(var(--footer-height) + var(--safe-bottom));

  padding-bottom: var(--safe-bottom);

  background: #080808;
  border-top: 1px solid #222;

  z-index: 100;

  display: flex;
  align-items: center;
  justify-content: center;
}

/* LINK DO SUPORTE */
.support-link {
  height: 32px;
  flex: 1;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 7px;

  color: #ffffff;
  text-decoration: none;

  font-size: 11px;
  font-weight: bold;
  letter-spacing: 0.7px;

  -webkit-tap-highlight-color: transparent;
  touch-action: pan-y;
}

.support-link:active {
  background: #171717;
}

.support-arrow {
  color: #00e676;
  font-size: 18px;
  line-height: 1;
}

/* BOTÃO DE OPÇÕES */
.menu-toggle {
  width: 45px;
  height: 32px;

  border: none;
  border-left: 1px solid #292929;

  background: #101010;
  color: #ffffff;

  font-size: 18px;
  cursor: pointer;
}

.menu-toggle:active {
  background: #292929;
}

/* MENU FLUTUANTE */
.quick-menu {
  position: fixed;

  bottom: calc(
    var(--footer-height) + var(--safe-bottom) + 7px
  );

  right: 8px;

  width: min(240px, calc(100vw - 16px));

  background: #111;
  border: 1px solid #303030;
  border-radius: 12px;

  padding: 9px;

  box-shadow: 0 4px 25px rgba(0,0,0,.6);

  z-index: 101;
}

.quick-menu[hidden] {
  display: none;
}

/* BOTÕES DO MENU */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 100%;
  min-height: 43px;

  padding: 9px;
  margin-bottom: 7px;

  border-radius: 8px;

  color: #fff;
  text-decoration: none;

  font-size: 12px;
  font-weight: bold;
  text-align: center;
}

.btn:last-child {
  margin-bottom: 0;
}

/* DOWNLOAD */
.btn-download {
  background: linear-gradient(
    45deg,
    #00c853,
    #1db954
  );
}

/* OUTRAS BANCAS */
.btn-outras {
  background: linear-gradient(
    45deg,
    #2196f3,
    #1976d2
  );
}

.btn:active {
  opacity: .85;
  transform: scale(.98);
}

</style>
</head>

<body>

<!-- IFRAME PRINCIPAL DA ÁGUIA OFICIAL -->
<div class="iframe-container">

  <iframe
    src="https://app.aguiaoficial.vip/pr/stBCno8r"
    title="Águia Oficial"
    allowfullscreen
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>

</div>

<!-- MENU COM DOWNLOAD E OUTRAS BANCAS -->
<nav
  class="quick-menu"
  id="quickMenu"
  aria-label="Opções do site"
  hidden>

  <a
    href="https://play.google.com/store/apps/details?id=aguia.oficial"
    class="btn btn-download"
    target="_blank"
    rel="noopener noreferrer">

    📲 Baixar Aplicativo

  </a>

  <a
    href="https://www.zepitaco.com"
    class="btn btn-outras"
    target="_blank"
    rel="noopener noreferrer">

    🏦 Outras Bancas

  </a>

</nav>

<!-- RODAPÉ PRETO FINO -->
<footer class="bottom-bar">

  <!-- SUPORTE ABRE EM NOVA ABA -->
  <a
    href="https://app.jadeucerto.net/"
    class="support-link"
    id="supportLink"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Abrir suporte em uma nova aba">

    <span class="support-arrow">⌃</span>

    <span>SUPORTE — ARRASTE PARA CIMA</span>

  </a>

  <!-- BOTÃO DO MENU -->
  <button
    class="menu-toggle"
    id="menuToggle"
    type="button"
    aria-label="Abrir opções"
    aria-controls="quickMenu"
    aria-expanded="false">

    ☰

  </button>

</footer>

<script>
(function() {
  "use strict";

  const supportLink =
    document.getElementById("supportLink");

  const menuToggle =
    document.getElementById("menuToggle");

  const quickMenu =
    document.getElementById("quickMenu");

  let startY = 0;
  let swipeHandled = false;

  /* ABRIR MENU */
  function toggleMenu() {
    const aberto = !quickMenu.hidden;

    quickMenu.hidden = aberto;

    menuToggle.setAttribute(
      "aria-expanded",
      String(!aberto)
    );
  }

  function closeMenu() {
    quickMenu.hidden = true;

    menuToggle.setAttribute(
      "aria-expanded",
      "false"
    );
  }

  menuToggle.addEventListener(
    "click",
    function(e) {
      e.stopPropagation();
      toggleMenu();
    }
  );

  /* FECHAR MENU AO CLICAR FORA */
  document.addEventListener(
    "click",
    function(e) {
      if (
        !quickMenu.contains(e.target) &&
        !menuToggle.contains(e.target)
      ) {
        closeMenu();
      }
    }
  );

  /* FECHAR MENU AO APERTAR ESC */
  document.addEventListener(
    "keydown",
    function(e) {
      if (e.key === "Escape") {
        closeMenu();
      }
    }
  );

  /* SUPORTE POR ARRASTAR PARA CIMA */
  supportLink.addEventListener(
    "touchstart",
    function(e) {
      startY = e.changedTouches[0].clientY;
      swipeHandled = false;
    },
    { passive: true }
  );

  supportLink.addEventListener(
    "touchend",
    function(e) {
      const endY =
        e.changedTouches[0].clientY;

      const deltaY = endY - startY;

      if (deltaY < -30) {
        swipeHandled = true;

        closeMenu();

        window.open(
          supportLink.href,
          "_blank",
          "noopener,noreferrer"
        );
      }
    },
    { passive: true }
  );

  /* EVITA ABERTURA DUPLICADA DEPOIS DO SWIPE */
  supportLink.addEventListener(
    "click",
    function(e) {
      if (swipeHandled) {
        e.preventDefault();
        swipeHandled = false;
      }
    }
  );

})();
</script>

</body>
</html>
